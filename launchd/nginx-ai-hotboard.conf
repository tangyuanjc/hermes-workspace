# Deploy to /etc/nginx/sites-available/ai-hotboard on the VPS.
# 注意: 部署前 backup 现网 config (cp /etc/nginx/sites-available/ai-hotboard /etc/nginx/sites-available/ai-hotboard.bak-$(date +%F))
# 防止覆盖丢现网 set_real_ip_from / Cloudflare CIDR 配置.

upstream ai_hotboard_app {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name aihotboard.tangyuanjc.com;

  # Cloudflare 真实 IP (公网用户 IP 通过 CF-Connecting-IP header 传, 否则 nginx 看到的是 CF 边缘节点 IP)
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;
  real_ip_header CF-Connecting-IP;

  # 上传大小 (image proxy 5MB + buffer)
  client_max_body_size 10M;

  # 长连接 (SSE / WebSocket)
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";

  location /assets/ {
    proxy_pass http://ai_hotboard_app;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # production hash 文件 (vite build 输出 main-XXX.js 等), 可放心 immutable cache
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / {
    proxy_pass http://ai_hotboard_app;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}
